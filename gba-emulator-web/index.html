<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBA Browser Emulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: #111111;
            color: #e0e0e0;
            min-height: 100vh;
            height: 100%;
        }
        .main { width: 100%; max-width: 900px; padding: 24px 20px; margin: 0 auto; }
        #upload-area {
            border: 2px dashed rgba(229,115,115,0.3);
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.02);
        }
        #upload-area:hover { border-color: #e57373; background: rgba(229,115,115,0.05); }
        #upload-area.dragover { border-color: #e57373; background: rgba(229,115,115,0.08); }
        #upload-area .icon { font-size: 48px; margin-bottom: 10px; }
        #upload-area p { color: #aaa; font-size: 15px; }
        #upload-area .formats { font-size: 12px; color: #555; margin-top: 8px; }
        #file-info {
            display: none;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        #file-info.visible { display: block; }
        #file-info .name { color: #e57373; font-weight: bold; }
        #file-info .size { color: #888; font-size: 13px; }
        .emulator-container {
            display: none;
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .emulator-container.visible { display: block; }
        .emu-toolbar {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 30;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 4px 8px;
            gap: 4px;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .emu-toolbar.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .emu-toolbar-hint {
            position: absolute;
            top: 4px;
            right: 8px;
            z-index: 29;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .emu-toolbar-hint.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .emu-toolbar-hint svg { width: 16px; height: 16px; fill: rgba(255,255,255,0.6); }
        .emu-tb-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            white-space: nowrap;
        }
        .emu-tb-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .emu-tb-btn svg { flex-shrink: 0; }
        @media (max-width: 600px) {
            .emu-tb-btn span { display: none; }
            .emu-tb-btn { padding: 8px; }
            .emu-toolbar { gap: 2px; padding: 4px 4px; }
        }
        .emulator-container:fullscreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 0;
            border: none;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        .emulator-container:fullscreen .emu-toolbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 999;
        }
        .emulator-container:fullscreen .emu-toolbar-hint {
            position: fixed;
            z-index: 998;
        }
        .emulator-container:fullscreen canvas {
            width: 100vw;
            height: 100vh;
            object-fit: fill;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: auto;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 16px;
            overflow: hidden;
            display: none;
        }
        .progress-bar.visible { display: block; }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e57373, #ef5350);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s;
        }
        .status-text {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }
        .controls-help {
            margin-top: 20px;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .controls-help h3 {
            font-size: 13px;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .controls-help .row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }
        .controls-help .row span:last-child {
            color: rgba(255,255,255,0.6);
            font-family: monospace;
        }
        .mobile-note {
            display: none;
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            text-align: center;
            margin-top: 12px;
        }
        @media (pointer: coarse) {
            .mobile-note { display: block; }
            .controls-help { display: none; }
        }
    </style>
</head>
<body>
    <div class="main">
        <div id="upload-area">
            <div class="icon">🎮</div>
            <p>Drop a GBA ROM here or click to browse</p>
            <div class="formats">Supports .gba, .zip files</div>
        </div>
        <input type="file" id="file-input" accept=".gba,.zip" style="display:none">
        <div id="file-info">
            <div class="name" id="file-name"></div>
            <div class="size" id="file-size"></div>
        </div>
        <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="status-text" id="status-text"></div>
        <div class="emulator-container" id="emulator-container">
            <div class="emu-toolbar-hint" id="toolbar-hint">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
            </div>
            <div class="emu-toolbar" id="emu-toolbar">
                <button class="emu-tb-btn" id="btn-fullscreen" title="Fullscreen">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                    <span>Fullscreen</span>
                </button>
                <button class="emu-tb-btn" id="btn-reset" title="Reset">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    <span>Reset</span>
                </button>
                <button class="emu-tb-btn" id="btn-mute" title="Mute">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    <span>Mute</span>
                </button>
            </div>
            <canvas id="emulator-canvas"></canvas>
        </div>
        <div class="controls-help" id="controls-help">
            <h3>Keyboard Controls</h3>
            <div class="row"><span>D-Pad</span><span>WASD / Arrow Keys</span></div>
            <div class="row"><span>A Button</span><span>K</span></div>
            <div class="row"><span>B Button</span><span>J</span></div>
            <div class="row"><span>L</span><span>Q</span></div>
            <div class="row"><span>R</span><span>E</span></div>
            <div class="row"><span>Start</span><span>Enter</span></div>
            <div class="row"><span>Select</span><span>Right Shift</span></div>
            <div class="row"><span>Fullscreen</span><span>Double-click canvas</span></div>
        </div>
        <div class="mobile-note">Use a keyboard for controls, or connect a USB/Bluetooth controller.</div>
    </div>

    <script type="module">
        import mGBA from './mgba.js';

        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');
        const fileName = document.getElementById('file-name');
        const fileSize = document.getElementById('file-size');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const statusText = document.getElementById('status-text');
        const emulatorContainer = document.getElementById('emulator-container');
        const canvas = document.getElementById('emulator-canvas');
        const toolbarHint = document.getElementById('toolbar-hint');
        const emuToolbar = document.getElementById('emu-toolbar');

        let emulator = null;
        let toolbarTimeout = null;
        let isMuted = false;

        function setStatus(msg) { statusText.textContent = msg; }
        function setProgress(pct) { progressFill.style.width = pct + '%'; }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', e => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) loadFile(fileInput.files[0]);
        });

        async function loadFile(file) {
            if (!file.name.toLowerCase().endsWith('.gba') && !file.name.toLowerCase().endsWith('.zip')) {
                setStatus('Please select a .gba or .zip file');
                return;
            }

            uploadArea.style.display = 'none';
            fileInfo.classList.add('visible');
            fileName.textContent = file.name;
            fileSize.textContent = formatSize(file.size);
            progressBar.classList.add('visible');
            setStatus('Initializing emulator...');

            try {
                if (!emulator) {
                    setProgress(10);
                    emulator = await mGBA({ canvas });
                    setProgress(30);
                    setStatus('Setting up filesystem...');
                    await emulator.FSInit();
                    setProgress(60);
                }

                setProgress(70);
                setStatus('Loading ROM...');

                await new Promise((resolve, reject) => {
                    emulator.uploadRom(file, (err) => {
                        if (err) reject(err);
                        else resolve();
                    });
                });

                setProgress(90);
                setStatus('Starting game...');

                const paths = emulator.filePaths();
                const success = emulator.loadGame(paths.gamePath + '/' + file.name);

                if (success) {
                    setProgress(100);
                    setStatus('');
                    progressBar.classList.remove('visible');
                    emulatorContainer.classList.add('visible');
                    setupToolbar();
                    setupKeyboard();
                    setupFullscreen();
                } else {
                    setStatus('Failed to load ROM. The file may be corrupted.');
                    progressBar.classList.remove('visible');
                }
            } catch (err) {
                console.error('Load error:', err);
                setStatus('Error: ' + (err.message || 'Unknown error'));
                progressBar.classList.remove('visible');
            }
        }

        function setupToolbar() {
            let hideTimer;
            function showToolbar() {
                emuToolbar.classList.add('visible');
                toolbarHint.classList.add('visible');
                clearTimeout(hideTimer);
                hideTimer = setTimeout(() => {
                    emuToolbar.classList.remove('visible');
                    toolbarHint.classList.remove('visible');
                }, 3000);
            }

            emulatorContainer.addEventListener('mousemove', showToolbar);
            emulatorContainer.addEventListener('touchstart', showToolbar, { passive: true });
            toolbarHint.addEventListener('click', showToolbar);
            showToolbar();
        }

        function setupKeyboard() {
            const keyMap = {
                'KeyW': 'Up', 'ArrowUp': 'Up',
                'KeyS': 'Down', 'ArrowDown': 'Down',
                'KeyA': 'Left', 'ArrowLeft': 'Left',
                'KeyD': 'Right', 'ArrowRight': 'Right',
                'KeyK': 'A',
                'KeyJ': 'B',
                'KeyQ': 'L',
                'KeyE': 'R',
                'Enter': 'Start',
                'ShiftRight': 'Select',
            };

            document.addEventListener('keydown', e => {
                const btn = keyMap[e.code];
                if (btn && emulator) {
                    e.preventDefault();
                    emulator.buttonPress(btn);
                }
            });

            document.addEventListener('keyup', e => {
                const btn = keyMap[e.code];
                if (btn && emulator) {
                    e.preventDefault();
                    emulator.buttonUnpress(btn);
                }
            });
        }

        function setupFullscreen() {
            canvas.addEventListener('dblclick', () => {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    emulatorContainer.requestFullscreen();
                }
            });

            document.getElementById('btn-fullscreen').addEventListener('click', () => {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    emulatorContainer.requestFullscreen();
                }
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                if (emulator) emulator.quickReload();
            });

            document.getElementById('btn-mute').addEventListener('click', () => {
                if (!emulator) return;
                isMuted = !isMuted;
                if (isMuted) {
                    emulator.pauseAudio();
                    document.getElementById('btn-mute').classList.add('active');
                } else {
                    emulator.resumeAudio();
                    document.getElementById('btn-mute').classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
