  <!-- ============================================================
       JAVASCRIPT
  ============================================================ -->
  <script>
    // ═══════════════════════════════════════════════════════════════
    //  TAB SWITCHING — PSP Emulator / GBA Emulator
    // ═══════════════════════════════════════════════════════════════
    const sidebarTabs = document.querySelectorAll('.sidebar-tab');
    const mobileTabs = document.querySelectorAll('.mobile-tab');
    const allTabs = document.querySelectorAll('.sidebar-tab, .mobile-tab');
    const viewEmulatorPSP = document.getElementById('view-emulator-psp');
    const viewEmulatorGBA = document.getElementById('view-emulator-gba');

    function switchToView(view) {
      allTabs.forEach(t => t.classList.toggle('active', t.dataset.view === view));
      viewEmulatorPSP.classList.toggle('hidden', view !== 'emulator-psp');
      viewEmulatorGBA.classList.toggle('hidden', view !== 'emulator-gba');
      document.body.classList.add('emulator-active');
      if (view === 'emulator-psp') {
        const iframe = document.getElementById('emu-iframe-psp');
        if (iframe && !iframe.src.includes('psp-emulator-web')) {
          iframe.src = '/psp-emulator-web/';
        }
      }
      if (view === 'emulator-gba') {
        const iframe = document.getElementById('emu-iframe-gba');
        if (iframe && !iframe.src.includes('gba-emulator-web')) {
          iframe.src = '/gba-emulator-web/';
        }
      }
    }

    allTabs.forEach(tab => {
      tab.addEventListener('click', () => switchToView(tab.dataset.view));
    });

    // Start on PSP tab
    switchToView('emulator-psp');

    // ═══════════════════════════════════════════════════════════════
    //  COOKIE CONSENT
    // ═══════════════════════════════════════════════════════════════
    (function cookieConsent() {
      const banner = document.getElementById('cookie-banner');
      if (!banner) return;
      const consent = localStorage.getItem('eggermath_cookie_consent');
      if (!consent) {
        setTimeout(() => banner.classList.add('visible'), 1200);
      }
      document.getElementById('cookie-accept').addEventListener('click', () => {
        localStorage.setItem('eggermath_cookie_consent', 'accepted');
        banner.classList.remove('visible');
        setTimeout(() => banner.style.display = 'none', 400);
      });
      document.getElementById('cookie-decline').addEventListener('click', () => {
        localStorage.setItem('eggermath_cookie_consent', 'declined');
        banner.classList.remove('visible');
        setTimeout(() => banner.style.display = 'none', 400);
      });
    })();

    // ═══════════════════════════════════════════════════════════════
    //  SERVICE WORKER
    // ═══════════════════════════════════════════════════════════════
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    }

  </script>
