name: Auto Campaign (DISABLED - recovery mode)
# DISABLED: Too much activity causing Google to flag site. Enable after 5 days of stability.
# on:
#   schedule:
#     - cron: '0 9 * * *'
on:
  workflow_dispatch: {}
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/auto-campaign.mjs
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
