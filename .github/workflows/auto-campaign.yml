name: Auto Campaign
on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch: {}
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/auto-campaign.mjs
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
  blog-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: cd eggermath-astro && npm install
      - name: Run Reddit Blog Agent
        run: node eggermath-astro/scripts/reddit-blog-agent.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Commit and push
        run: |
          git config user.name "Reddit Blog Bot"
          git config user.email "bot@eggermath.com"
          git add eggermath-astro/src/pages/blog/ eggermath-astro/reddit-blog-log.json eggermath-astro/reddit-blog-state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Blog: Auto-generated post $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
