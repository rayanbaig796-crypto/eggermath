name: Trigger Blog Agent

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Reddit Blog Agent
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'reddit-blog-agent.yml',
              ref: 'main'
            });
            console.log('Triggered Reddit Blog Agent');
