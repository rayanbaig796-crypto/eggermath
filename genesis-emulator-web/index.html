<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sega Genesis Browser Emulator — Play Mega Drive Games Online</title>
    <meta name="description" content="Play Sega Genesis / Mega Drive games directly in your browser. Sonic, Streets of Rage, Shinobi and more!">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.eggermath.com/genesis-emulator-web/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="EggerMath">
    <meta property="og:title" content="Sega Genesis Browser Emulator — Play Mega Drive Games Online">
    <meta property="og:description" content="Play Sega Genesis / Mega Drive games in your browser. No download needed.">
    <meta property="og:url" content="https://www.eggermath.com/genesis-emulator-web/">
    <meta property="og:image" content="https://www.eggermath.com/images/eggermath-logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sega Genesis Browser Emulator">
    <meta name="twitter:description" content="Play Sega Genesis / Mega Drive games in your browser. No download needed.">
    <meta name="twitter:image" content="https://www.eggermath.com/images/eggermath-logo.png">
    <link rel="icon" type="image/x-icon" href="../images/eggermath-logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: #111111;
            color: #e0e0e0;
            min-height: 100vh;
            height: 100%;
        }
        .main { width: 100%; max-width: 900px; padding: 24px 20px; margin: 0 auto; }
        #upload-area {
            border: 2px dashed rgba(229,115,115,0.3);
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.02);
        }
        #upload-area:hover { border-color: #e57373; background: rgba(229,115,115,0.05); }
        #upload-area.dragover { border-color: #e57373; background: rgba(229,115,115,0.08); }
        #upload-area .icon { font-size: 48px; margin-bottom: 10px; }
        #upload-area p { color: #aaa; font-size: 15px; }
        #upload-area .formats { font-size: 12px; color: #555; margin-top: 8px; }
        #file-info {
            display: none;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        #file-info.visible { display: block; }
        #file-info .name { color: #e57373; font-weight: bold; }
        #file-info .size { color: #888; font-size: 13px; }
        #emulator-container {
            display: none;
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
        }
        #emulator-container.visible { display: block; }
        #emulator-container canvas {
            display: block;
            width: 100%;
            height: auto;
        }
        #emulator-container:fullscreen {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
            border: none;
        }
        #emulator-container:fullscreen canvas {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 16px;
            overflow: hidden;
            display: none;
        }
        .progress-bar.visible { display: block; }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e57373, #ef5350);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s;
        }
        .status-text {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }
        .controls-help {
            margin-top: 20px;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .controls-help h3 {
            font-size: 13px;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .controls-help .row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }
        .controls-help .row span:last-child {
            color: rgba(255,255,255,0.6);
            font-family: monospace;
        }
        @media (max-width: 600px) {
            .main { padding: 0; max-width: 100%; }
            #upload-area { border-radius: 0; margin: 0; border-left: none; border-right: none; }
            #emulator-container { border-radius: 0; border: none; }
            #emulator-container canvas { width: 100vw; }
        }
    </style>
</head>
<body>
    <div class="main">
        <div id="upload-area">
            <div class="icon">🎮</div>
            <p>Drop a Sega Genesis ROM here or click to browse</p>
            <div class="formats">Supports .gen, .bin, .md, .zip, .7z files</div>
        </div>
        <input type="file" id="file-input" accept=".gen,.bin,.md,.zip,.7z" style="display:none">
        <div id="file-info">
            <div class="name" id="file-name"></div>
            <div class="size" id="file-size"></div>
        </div>
        <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="status-text" id="status-text"></div>
        <div id="emulator-container"></div>
        <div class="controls-help">
            <h3>Keyboard Controls</h3>
            <div class="row"><span>D-Pad</span><span>WASD / Arrow Keys</span></div>
            <div class="row"><span>A Button</span><span>K</span></div>
            <div class="row"><span>B Button</span><span>J</span></div>
            <div class="row"><span>C Button</span><span>L</span></div>
            <div class="row"><span>Start</span><span>Enter</span></div>
            <div class="row"><span>Save State</span><span>F5</span></div>
            <div class="row"><span>Load State</span><span>F9</span></div>
            <div class="row"><span>Fullscreen</span><span>Double-click canvas</span></div>
        </div>
    </div>

    <script>
        window.EJS_core = "genesis";
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_player = "#emulator-container";
        window.EJS_color = "#111111";
        window.EJS_startOnLoaded = false;
        window.EJS_fullscreenOnLoaded = false;
        window.EJS_controlScheme = 0;

        let gameUrl = null;

        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');
        const fileName = document.getElementById('file-name');
        const fileSize = document.getElementById('file-size');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const statusText = document.getElementById('status-text');
        const container = document.getElementById('emulator-container');

        function setStatus(msg) { statusText.textContent = msg; }
        function setProgress(pct) { progressFill.style.width = pct + '%'; }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', e => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) loadFile(fileInput.files[0]);
        });

        function loadFile(file) {
            const ext = file.name.toLowerCase().split('.').pop();
            if (!['gen', 'bin', 'md', 'zip', '7z'].includes(ext)) {
                setStatus('Please select a .gen, .bin, .md, .zip, or .7z file');
                return;
            }

            uploadArea.style.display = 'none';
            fileInfo.classList.add('visible');
            fileName.textContent = file.name;
            fileSize.textContent = formatSize(file.size);
            progressBar.classList.add('visible');
            setProgress(10);
            setStatus('Loading emulator engine...');

            const blobUrl = URL.createObjectURL(file);
            gameUrl = blobUrl;

            window.EJS_gameUrl = blobUrl;
            window.EJS_gameName = file.name;

            setProgress(30);

            if (!document.querySelector('script[src*="loader.js"]')) {
                const script = document.createElement('script');
                script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
                script.onload = () => {
                    setProgress(60);
                    setStatus('Starting emulator...');
                    setTimeout(() => {
                        setProgress(100);
                        setStatus('');
                        progressBar.classList.remove('visible');
                        container.classList.add('visible');
                    }, 500);
                };
                script.onerror = () => {
                    setStatus('Failed to load emulator engine. Please refresh.');
                    progressBar.classList.remove('visible');
                };
                document.head.appendChild(script);
            } else {
                setProgress(100);
                setStatus('');
                progressBar.classList.remove('visible');
                container.classList.add('visible');
            }
        }
    </script>
</body>
</html>
